name: Cl

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Update apt and install dependencies
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp curl unzip

    - name: Set password for ubuntu user
      run: echo "ubuntu:0903772@aM" | sudo chpasswd

    - name: Add ubuntu user to xrdp group
      run: sudo adduser ubuntu xrdp

    - name: Enable xfce as default desktop for xrdp
      run: echo "startxfce4" | sudo tee -a /etc/skel/.xsession

    - name: Download ngrok
      run: |
        curl -s -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
        unzip ngrok.zip

    - name: Authenticate ngrok
      run: ./ngrok config add-authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Start xrdp service
      run: |
        sudo systemctl enable xrdp
        sudo systemctl start xrdp

    - name: Start ngrok tunnel for RDP
      run: |
        nohup ./ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &

    - name: Get ngrok tunnel info
      run: |
        sudo apt install -y jq
        NGROK_TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.proto=="tcp") | .public_url')
        echo "🔗 RDP Address: $NGROK_TUNNEL_URL"

    - name: Keep session alive
      run: sleep 21600  # 6 hours
