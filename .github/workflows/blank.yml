name: Cl

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract ngrok
      run: Expand-Archive ngrok.zip -DestinationPath .

    - name: Authenticate ngrok
      run: .\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Lite@Base!0549749657987465" -Force)

    - name: Create single LiteBase user
      id: create_user
      run: |
        $rand = Get-Random -Minimum 10000 -Maximum 99999
        $username = "litebase$rand"
        $password = "Lite@Base!123"

        New-LocalUser -Name $username -Password (ConvertTo-SecureString -AsPlainText $password -Force) `
          -FullName "LiteBase User" -Description "Auto User"

        Add-LocalGroupMember -Group "Administrators" -Member $username

        echo "USERNAME=$username" >> $env:GITHUB_ENV
        echo "PASSWORD=$password" >> $env:GITHUB_ENV

    - name: Start ngrok tunnel
      run: |
        Start-Process -FilePath "$PWD\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        Start-Sleep -Seconds 5

    - name: Show RDP information (OUTPUT)
      run: |
        $rdpAddress = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels |
          Where-Object { $_.proto -eq "tcp" } |
          Select-Object -ExpandProperty public_url

        Write-Host "================ RDP INFO ================"
        Write-Host "SYSTEM   : Windows"
        Write-Host "RDP      : $rdpAddress"
        Write-Host "USERNAME : $Env:USERNAME"
        Write-Host "PASSWORD : $Env:PASSWORD"
        Write-Host "=========================================="

    - name: Keep session alive
      run: |
        Start-Sleep -Seconds 10800
        Stop-Computer -Force
