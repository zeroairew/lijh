name: CI

on: [push, workflow_dispatch]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Download ngrok
      run: wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip -O ngrok.zip

    - name: Extract ngrok
      run: unzip ngrok.zip

    - name: Auth
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Install desktop environment and xrdp
      run: |
        sudo apt update
        sudo apt install -y ubuntu-desktop xrdp
        sudo systemctl enable xrdp
        sudo systemctl start xrdp

    - name: Create a new user
      run: |
        sudo useradd -m -s /bin/bash litebase
        echo "litebase:Lite@Base!123" | sudo chpasswd
        sudo usermod -aG sudo litebase

    - name: Configure xrdp
      run: |
        echo "litebase" | sudo tee -a /etc/xrdp/sesman.ini
        echo "startxfce4" | sudo tee -a /home/litebase/.xsession

    - name: Create Tunnel
      run: nohup ./ngrok tcp 3389 &

    - name: Keep alive for maximum time
      run: sleep 21600  # 6 hours
