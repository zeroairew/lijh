name: Cl

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract ngrok
      run: Expand-Archive ngrok.zip -DestinationPath .

    - name: Authenticate ngrok
      run: .\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "0903772@aM" -Force)
    - name: Create LiteBase User
      run: |
        New-LocalUser -Name "litebase" -Password (ConvertTo-SecureString -AsPlainText "Lite@Base!123" -Force) -FullName "LiteBase User" -Description "Admin User for LiteBase"
        Add-LocalGroupMember -Group "Administrators" -Member "litebase"
    - name: Start ngrok tunnel in background
      run: |
        Start-Process -FilePath "$PWD\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        Start-Sleep -Seconds 5
    
    - name: Get ngrok tunnel info
      run: |
        $url = "http://127.0.0.1:4040/api/tunnels"
        $response = Invoke-RestMethod -Uri $url
        $tunnel = $response.tunnels | Where-Object {$_.proto -eq "tcp"}
        Write-Host "🔗 RDP Address: $($tunnel.public_url)"
    - name: Keep session alive
      run: Start-Sleep -Seconds 21600  # 6 hours
