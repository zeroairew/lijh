name: Cl

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set password for ubuntu user
      run: echo "root:09037720375@aM" | sudo chpasswd

    - name: Download ngrok
      run: |
        curl -s -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
        unzip ngrok.zip

    - name: Authenticate ngrok
      run: ./ngrok config add-authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Start ngrok SSH tunnel
      run: |
        nohup ./ngrok tcp 22 --log=stdout > ngrok.log 2>&1 &

    - name: Wait for ngrok to initialize
      run: sleep 10

    - name: Get ngrok tunnel info
      run: |
        sudo apt install -y jq
        TUNNEL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.proto=="tcp") | .public_url')
        echo "🔗 SSH Address: $TUNNEL"
        echo "🧑‍💻 Username: root"
        echo "🔑 Password: 09037720375@aM"

    - name: Keep session alive
      run: sleep 21600  # 6 hours
