name: Server

on: [push, workflow_dispatch]

jobs:
  setup-ssh:
    runs-on: ubuntu-latest

    steps:
    - name: Install and configure SSH
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server
        sudo systemctl enable ssh
        sudo systemctl start ssh

    - name: Create LiteBase Users
      id: create_users
      run: |
        USER_LIST=""
        for i in {1..5}; do
          RAND=$(shuf -i 10000-99999 -n 1)
          USERNAME="litebase$RAND"
          PASSWORD="Lite@Base!123"
          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"
          USER_LIST="$USER_LIST,$USERNAME"
        done
        USER_LIST=${USER_LIST:1}
        echo "USERS=$USER_LIST" >> $GITHUB_ENV

    - name: Download ngrok
      run: |
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -O ngrok.tgz
        tar xvf ngrok.tgz

    - name: Authenticate ngrok
      run: ./ngrok config add-authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Start ngrok tunnel for SSH
      run: ./ngrok tcp 22 > /dev/null &

    - name: Send RDP info to server
      shell: pwsh
      run: |
        $rdpAddress = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -ExpandProperty public_url
        $usernames = "${Env:USERS}" -split ","
        $password = "Lite@Base!123"
        $Sys = "ubuntu"

        $body = @{
        usernames = $usernames
        password = $password
        rdp = $rdpAddress
        system = $Sys
        } | ConvertTo-Json -Depth 10
        
        Invoke-RestMethod -Uri "https://service.litebase.ir/save_rdp.php" -Method POST -Body $body -ContentType "application/json"

    - name: Keep session alive
      run: |
        sleep 10800
        sudo shutdown -h now
