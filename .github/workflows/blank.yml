name: Cl

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install Desktop Environment and xrdp
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp
        sudo systemctl enable xrdp
        sudo adduser litebase
        echo "github:Lite@Base!123" | sudo chpasswd
        sudo usermod -aG sudo github
        echo "startxfce4" | sudo tee -a /home/github/.xsession
        sudo chown github:github /home/github/.xsession
        sudo systemctl restart xrdp

    - name: Install ngrok
      run: |
        curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update
        sudo apt install ngrok -y

    - name: Authenticate ngrok
      run: ngrok config add-authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Start ngrok tunnel
      run: |
        nohup ngrok tcp 3389 > ngrok.log &
        sleep 10

    - name: Get ngrok tunnel info
      run: |
        sudo apt install -y jq
        curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[] | select(.proto=="tcp") | "🔗 RDP Address: \(.public_url)"'

    - name: Keep alive
      run: sleep 21600  # 6 hours
