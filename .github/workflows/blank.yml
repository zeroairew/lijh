name: Ubuntu SSH via Ngrok

on: [push, workflow_dispatch]

jobs:
  setup-ssh:
    runs-on: ubuntu-latest

    steps:
    # نصب و پیکربندی SSH
    - name: Install and configure SSH
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server
        sudo systemctl enable ssh
        sudo systemctl start ssh

    # ایجاد کاربر جدید (اختیاری)
    - name: Create LiteBase User
      run: |
        sudo useradd -m -s /bin/bash litebase
        echo "litebase:Lite@Base!123" | sudo chpasswd
        sudo usermod -aG sudo litebase

    # دانلود Ngrok
    - name: Download ngrok
      run: |
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -O ngrok.tgz
        tar xvf ngrok.tgz

    # احراز هویت Ngrok
    - name: Authenticate ngrok
      run: ./ngrok config add-authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    # اجرای Ngrok برای تونل SSH (پورت 22)
    - name: Start ngrok tunnel for SSH
      run: |
        ./ngrok tcp 22 > /dev/null &
        sleep 5  # صبر برای راه‌اندازی Ngrok

    # نمایش آدرس SSH عمومی
    - name: Get ngrok SSH tunnel info
      run: |
        url="http://127.0.0.1:4040/api/tunnels"
        response=$(curl -s $url)
        tunnel=$(echo $response | jq -r '.tunnels[] | select(.proto == "tcp")')
        public_url=$(echo $tunnel | jq -r '.public_url')
        echo "🔗 SSH Address: $public_url"
        echo "👤 Username: litebase"
        echo "🔑 Password: Lite@Base!123"

    # نگه‌داشتن Session فعال برای ۶ ساعت
    - name: Keep session alive
      run: sleep 21600  # 6 hours
