name: CI

on: [push, workflow_dispatch]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Download ngrok
      run: wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip -O ngrok.zip

    - name: Extract ngrok
      run: unzip ngrok.zip

    - name: Auth
      run: ./ngrok authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: 2domMyUkChGDUi8XXsckGd8N4Ay_3rA6NmKnNNJGWxX7qqcN1

    - name: Enable Remote Desktop (xrdp)
      run: |
        sudo apt update
        sudo apt install -y xrdp
        sudo systemctl enable xrdp
        sudo systemctl start xrdp

    - name: Create LiteBase User
      run: |
        sudo useradd -m -s /bin/bash litebase
        echo "litebase:Lite@Base!123" | sudo chpasswd
        sudo usermod -aG sudo litebase

    - name: Create Tunnel
      run: ./ngrok tcp 3389
