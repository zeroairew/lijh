name: CI

on: [push, workflow_dispatch]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Download ngrok
      run: wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip -O ngrok.zip

    - name: Extract ngrok
      run: unzip ngrok.zip

    - name: Auth
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Create a new user
      run: |
        sudo useradd -m -s /bin/bash litebase
        echo "litebase:Lite@Base!123" | sudo chpasswd
        sudo usermod -aG sudo litebase

    - name: Create Tunnel
      run: nohup ./ngrok tcp 22 &

    - name: Keep alive for maximum time
      run: sleep 21600  # 6 hours
